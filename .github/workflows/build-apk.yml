name: Build native TECH EMPIRE APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths-ignore: ['src/**', '*.md', 'docs/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TECH_EMPIRE_TOOLS_DIR: ${{ runner.temp }}/tech-empire-tools
      XDG_DATA_HOME: ${{ runner.temp }}/tech-empire-tools/xdg/data
      XDG_CONFIG_HOME: ${{ runner.temp }}/tech-empire-tools/xdg/config
      XDG_CACHE_HOME: ${{ runner.temp }}/tech-empire-tools/xdg/cache
      ANDROID_HOME: ${{ runner.temp }}/tech-empire-tools/android-sdk
      ANDROID_USER_HOME: ${{ runner.temp }}/tech-empire-tools/android-user
      GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.6.3-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tech-empire-tools
          key: godot-4.6.3-android36-buildtools36.0.0-v1
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Install Android SDK and Godot native export templates
        run: bash tools/android/bootstrap.sh
      - name: Import, test, export and verify APK
        run: bash tools/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TECH-EMPIRE-Android-debug
          path: |
            artifacts/TECH-EMPIRE-debug.apk
            artifacts/TECH-EMPIRE-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TECH-EMPIRE-build-logs
          path: artifacts/logs/
          if-no-files-found: warn
