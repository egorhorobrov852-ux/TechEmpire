name: Build TECH EMPIRE APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Package APK
        run: mkdir -p output && cp android/app/build/outputs/apk/debug/app-debug.apk output/TECH-EMPIRE-debug.apk && cd output && zip ../TECH-EMPIRE-APK.zip TECH-EMPIRE-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TECH-EMPIRE-APK
          path: TECH-EMPIRE-APK.zip
          retention-days: 14
